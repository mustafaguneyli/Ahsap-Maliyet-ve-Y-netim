services:
  postgres:
    image: postgres:16-alpine
    container_name: zirve-ahsap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zirve
      POSTGRES_PASSWORD: zirve_dev
      POSTGRES_DB: zirve_ahsap
    ports:
      - "5432:5432"
    volumes:
      - zirve_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zirve -d zirve_ahsap"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  zirve_pg_data:
